<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <!-- Sky gradient from medium blue to soft sky blue -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4688e7"/>
      <stop offset="45%" stop-color="#5599f5"/>
      <stop offset="70%" stop-color="#2d73dc"/>
      <stop offset="100%" stop-color="#1448b8"/>
    </linearGradient>

    <!-- Globe Sphere Radial Gradient -->
    <radialGradient id="globeGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4ea2ff"/>
      <stop offset="40%" stop-color="#1f71df"/>
      <stop offset="75%" stop-color="#0945a8"/>
      <stop offset="100%" stop-color="#021d58"/>
    </radialGradient>

    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="rgba(100, 200, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(100, 200, 255, 0)"/>
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1000" height="120" fill="url(#skyGrad)"/>

  <!-- Fluffy Cumulus Clouds across the center and right -->
  <!-- Cloud 1 -->
  <g fill="rgba(255, 255, 255, 0.45)">
    <circle cx="340" cy="85" r="30"/>
    <circle cx="370" cy="75" r="35"/>
    <circle cx="410" cy="80" r="40"/>
    <circle cx="445" cy="88" r="28"/>
    <rect x="330" y="85" width="130" height="35" rx="10"/>
  </g>
  <!-- Cloud 2 -->
  <g fill="rgba(255, 255, 255, 0.65)">
    <circle cx="520" cy="90" r="28"/>
    <circle cx="550" cy="78" r="36"/>
    <circle cx="590" cy="82" r="38"/>
    <circle cx="630" cy="75" r="42"/>
    <circle cx="675" cy="80" r="38"/>
    <circle cx="715" cy="88" r="30"/>
    <rect x="500" y="85" width="230" height="35" rx="10"/>
  </g>
  <!-- Cloud 3 (Foreground pure white fluff) -->
  <g fill="#ffffff">
    <circle cx="570" cy="95" r="20"/>
    <circle cx="600" cy="88" r="26"/>
    <circle cx="635" cy="86" r="30"/>
    <circle cx="670" cy="90" r="24"/>
    <rect x="560" y="94" width="130" height="26"/>
  </g>

  <!-- Giant Globe Rising from Bottom Right (as seen in screenshot) -->
  <g transform="translate(830, 110)">
    <!-- Atmosphere glow ring -->
    <circle cx="0" cy="0" r="108" fill="url(#atmoGlow)"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#68c0ff" stroke-width="4" opacity="0.8"/>
    <!-- Ocean sphere -->
    <circle cx="0" cy="0" r="100" fill="url(#globeGrad)"/>
    
    <!-- Continents (Detailed green landmasses) -->
    <!-- Continent 1 -->
    <path d="M -80 -40 Q -60 -70 -20 -80 Q 20 -70 40 -50 Q 10 -30 -30 -20 Q -60 -20 -80 -40 Z" fill="#2eb82e" stroke="#1d801d" stroke-width="1.5"/>
    <path d="M -15 -75 Q 10 -65 30 -48 Q 5 -32 -25 -25 Z" fill="#3cd63c"/>
    <!-- Continent 2 -->
    <path d="M -60 -10 Q -40 20 -10 10 Q 20 30 50 10 Q 70 -20 50 -40 Q 20 -20 -30 0 Z" fill="#259a25" stroke="#1d801d" stroke-width="1.5"/>
    <path d="M -45 5 Q -20 15 15 12 Q 40 5 35 -15 Z" fill="#3cd63c"/>
    <!-- Continent 3 -->
    <path d="M -20 -85 Q 30 -90 70 -65 Q 40 -45 10 -60 Z" fill="#2eb82e"/>
    <!-- Cloud swirls on globe -->
    <path d="M -70 -30 Q -30 -60 20 -50" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round"/>
    <path d="M -40 10 Q 10 -10 60 5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -10 -70 Q 30 -60 50 -75" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round"/>

    <!-- Subtle Latitude/Longitude Grid in Globe -->
    <ellipse cx="0" cy="0" rx="98" ry="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="48" ry="98" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  </g>
</svg>
